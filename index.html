<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8f8f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Tally — notes that add up. Write a list, get a time estimate for every line." />
    <!-- Brand type: Poppins for the UI, Fraunces for headings and numbers; the brush face is subset to the three glyphs of the signature -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&text=%EA%B9%80%EC%B1%84%EC%9A%B4&display=swap" />
    <!-- PNG first for browsers without SVG favicons; SVG wins where supported -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Tally" />

    <!-- Link previews (iMessage, Slack, LinkedIn, X). Absolute URLs on the public production domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tally" />
    <meta property="og:title" content="Tally — Notes that add up" />
    <meta property="og:description" content="Write a list. Every line gets a time estimate, and your day adds up." />
    <meta property="og:url" content="https://tally-lake-seven.vercel.app/" />
    <meta property="og:image" content="https://tally-lake-seven.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tally: know how long your to-do list will actually take." />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Tally</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
